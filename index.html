<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Course Registration System</title>
<style>
:root{--bg:#eef2f5;--panel:#fff;--ink:#14212b;--mute:#5b6b78;--line:#d5dde3;--acc:#0b6e6e;--acc2:#e8f3f3;--bad:#b3261e}
@media(prefers-color-scheme:dark){:root{--bg:#0f171d;--panel:#18232b;--ink:#e6edf1;--mute:#93a4b0;--line:#2b3a45;--acc:#4fc3c3;--acc2:#173236;--bad:#ff8a80}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Segoe UI",system-ui,sans-serif}
main{max-width:1060px;margin:0 auto;padding:28px 16px 48px}
h1{font:700 30px/1.2 Georgia,serif;margin:0 0 4px}h2{font-size:16px;margin:0 0 12px}
.sub{color:var(--mute);margin:0 0 22px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:6px;padding:12px 14px}
.stat b{display:block;font:700 26px Georgia,serif}.stat span{color:var(--mute);font-size:13px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;margin-bottom:18px}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;align-items:end}
label{font-size:13px;color:var(--mute);display:grid;gap:4px}
input,select{font:inherit;padding:8px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink);width:100%}
button{font:inherit;padding:8px 14px;border-radius:4px;border:1px solid var(--acc);background:var(--acc);color:#fff;cursor:pointer}
button.alt{background:transparent;color:var(--acc)}button.del{background:transparent;color:var(--bad);border-color:var(--bad)}
button.sm{padding:3px 9px;font-size:13px}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:640px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}th{color:var(--mute);font-weight:600;font-size:13px}
.tag{padding:2px 8px;border-radius:10px;background:var(--acc2);font-size:12px}
.bar{height:8px;background:var(--acc);border-radius:4px}
.top{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;margin-bottom:10px}
.top input{max-width:none;flex:1;min-width:240px}
pre{margin:0;white-space:pre-wrap;font:12.5px/1.5 Consolas,monospace;color:var(--mute)}
#msg{min-height:20px;margin-top:8px;font-size:14px}.err{color:var(--bad)}
</style></head><body><main>
<h1>Course Registration System</h1>

<section class="stats" id="stats"></section>

<section class="panel"><h2 id="ftitle">Register a student for a course</h2>
<form id="f"><input type="hidden" id="rid">
<label>Student<select id="sid" required></select></label>
<label>Course<select id="cid" required></select></label>
<label>Term<select id="term"><option>Autumn 2026</option><option>Spring 2026</option><option>Spring 2027</option></select></label>
<label>Status<select id="status"><option>Enrolled</option><option>Completed</option><option>Dropped</option></select></label>
<div><button id="save">Register</button> <button type="button" class="alt" id="cancel" hidden>Cancel edit</button></div></form>
<div id="msg" role="status"></div></section>

<section class="panel"><div class="top"><h2>Registrations</h2></div><div class="top">
<input id="q" type="search" placeholder="Search by Student ID, Name, Email, Course or Term..." aria-label="Search"></div>
<div class="wrap"><table><thead><tr><th>ID</th><th>Student</th><th>Course</th><th>Credits</th><th>Term</th><th>Status</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></section>

<section class="panel"><h2>Students</h2>
<form id="sf">
<label>Student ID<input id="s_id" placeholder="S107" required></label>
<label>Full name<input id="s_name" required></label>
<label>Email<input id="s_email" type="email" required></label>
<label>Department<select id="s_dept"><option>CSE</option><option>EEE</option><option>BBA</option><option>CE</option></select></label>
<label>Semester<input id="s_sem" type="number" min="1" max="8" value="1" required></label>
<div><button>Add student</button></div></form>
<div class="wrap"><table><thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Dept</th><th>Sem</th><th></th></tr></thead><tbody id="srows"></tbody></table></div></section>

<section class="panel"><h2>Courses</h2>
<form id="cf">
<label>Course code<input id="c_id" placeholder="CSE401" required></label>
<label>Title<input id="c_title" required></label>
<label>Credits<input id="c_cr" type="number" min="1" max="4" value="3" required></label>
<label>Instructor<input id="c_ins" required></label>
<div><button>Add course</button></div></form>
<div class="wrap"><table><thead><tr><th>Code</th><th>Title</th><th>Credits</th><th>Instructor</th><th></th></tr></thead><tbody id="crows"></tbody></table></div></section>

<section class="panel"><h2>Registrations per course</h2><div id="per"></div></section>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"></script>
<script>
const SCHEMA = `-- Course Registration System (DBMS Lab) - works in SQLite / MySQL (minor syntax changes)
PRAGMA foreign_keys = ON;

CREATE TABLE students (
  student_id  TEXT PRIMARY KEY,
  full_name   TEXT NOT NULL,
  email       TEXT NOT NULL UNIQUE,
  department  TEXT NOT NULL,
  semester    INTEGER NOT NULL CHECK (semester BETWEEN 1 AND 8)
);

CREATE TABLE courses (
  course_id   TEXT PRIMARY KEY,
  title       TEXT NOT NULL,
  credits     INTEGER NOT NULL CHECK (credits BETWEEN 1 AND 4),
  instructor  TEXT NOT NULL
);

CREATE TABLE registrations (
  reg_id      INTEGER PRIMARY KEY AUTOINCREMENT,
  student_id  TEXT NOT NULL,
  course_id   TEXT NOT NULL,
  term        TEXT NOT NULL,
  status      TEXT NOT NULL DEFAULT 'Enrolled' CHECK (status IN ('Enrolled','Completed','Dropped')),
  FOREIGN KEY (student_id) REFERENCES students(student_id),
  FOREIGN KEY (course_id)  REFERENCES courses(course_id),
  UNIQUE (student_id, course_id, term)
);

INSERT INTO students VALUES
('S101','Sumaiya','sumaiya@uni.edu','CSE',4),
('S102','Oishee','oishee@uni.edu','CSE',4),
('S103','Mariam','mariam@uni.edu','EEE',3),
('S104','Arin','arin@uni.edu','BBA',5),
('S105','Tahsin','tahsin@uni.edu','CSE',2),
('S106','Adel','adel@uni.edu','EEE',6);

INSERT INTO courses VALUES
('CSE201','Database Systems',3,'Dr. Shorob'),
('CSE105','Programming Fundamentals',3,'Ms. Faria'),
('CSE310','Operating Systems',3,'Dr. Salma'),
('EEE210','Digital Logic Design',3,'Mr. Rahim'),
('MAT101','Discrete Mathematics',2,'Dr. Nasrin'),
('BBA150','Principles of Management',2,'Ms. Samiha');

INSERT INTO registrations (student_id, course_id, term, status) VALUES
('S101','CSE201','Autumn 2026','Enrolled'),
('S101','CSE310','Autumn 2026','Enrolled'),
('S101','MAT101','Spring 2026','Completed'),
('S102','CSE201','Autumn 2026','Enrolled'),
('S102','CSE105','Spring 2026','Completed'),
('S103','EEE210','Autumn 2026','Enrolled'),
('S103','MAT101','Autumn 2026','Enrolled'),
('S104','BBA150','Autumn 2026','Enrolled'),
('S104','MAT101','Spring 2026','Dropped'),
('S105','CSE105','Autumn 2026','Enrolled'),
('S106','EEE210','Spring 2026','Completed'),
('S106','CSE201','Autumn 2026','Enrolled');

-- Sample queries used by the app
-- JOIN:      SELECT r.reg_id, s.full_name, c.title, r.term, r.status FROM registrations r JOIN students s ON s.student_id=r.student_id JOIN courses c ON c.course_id=r.course_id;
-- AGGREGATE: SELECT c.title, COUNT(*) FROM registrations r JOIN courses c ON c.course_id=r.course_id GROUP BY c.course_id;
`;
let db; const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function q(sql, p = []) {
  const st = db.prepare(sql); st.bind(p); const out = [];
  while (st.step()) out.push(st.getAsObject()); st.free(); return out;
}
function note(t, bad) { $('msg').innerHTML = '<span class="' + (bad ? 'err' : '') + '">' + esc(t) + '</span>'; }
function loadSelects() {
  $('sid').innerHTML = q('SELECT student_id, full_name FROM students ORDER BY student_id').map(r => `<option value="${esc(r.student_id)}">${esc(r.student_id)} - ${esc(r.full_name)}</option>`).join('');
  $('cid').innerHTML = q('SELECT course_id, title FROM courses ORDER BY course_id').map(r => `<option value="${esc(r.course_id)}">${esc(r.course_id)} - ${esc(r.title)}</option>`).join('');
}
function render() {
  renderPeople();
  const s = q(`SELECT (SELECT COUNT(*) FROM students) AS st, (SELECT COUNT(*) FROM courses) AS co,
    COUNT(*) AS rg, SUM(r.status='Enrolled') AS en, ROUND(AVG(c.credits),1) AS av, MAX(c.credits) AS mx
    FROM registrations r JOIN courses c ON c.course_id = r.course_id`)[0];
  const items = [['Students', s.st], ['Courses', s.co], ['Registrations', s.rg], ['Currently enrolled', s.en], ['Avg credits', s.av], ['Max credits', s.mx]];
  $('stats').innerHTML = items.map(i => `<div class="stat"><b>${i[1] ?? 0}</b><span>${i[0]}</span></div>`).join('');
  const term = '%' + $('q').value.trim() + '%';
  const rows = q(`SELECT r.reg_id, s.full_name, s.student_id, s.email, c.course_id, c.title, c.credits, r.term, r.status
    FROM registrations r JOIN students s ON s.student_id = r.student_id JOIN courses c ON c.course_id = r.course_id
    WHERE s.student_id LIKE ? OR s.full_name LIKE ? OR s.email LIKE ? OR c.course_id LIKE ? OR c.title LIKE ? OR r.term LIKE ? OR r.status LIKE ? ORDER BY r.reg_id`, [term, term, term, term, term, term, term]);
  $('rows').innerHTML = rows.length ? rows.map(r => `<tr><td>${r.reg_id}</td><td>${esc(r.student_id)} - ${esc(r.full_name)}<br><small>${esc(r.email)}</small></td><td>${esc(r.course_id)} ${esc(r.title)}</td><td>${r.credits}</td><td>${esc(r.term)}</td><td><span class="tag">${esc(r.status)}</span></td>
    <td><button class="sm alt" data-e="${r.reg_id}">Edit</button> <button class="sm del" data-d="${r.reg_id}">Delete</button></td></tr>`).join('')
    : '<tr><td colspan="7">No registrations match your search.</td></tr>';
  const per = q(`SELECT c.title, COUNT(r.reg_id) AS n FROM courses c LEFT JOIN registrations r ON r.course_id = c.course_id GROUP BY c.course_id ORDER BY n DESC`);
  const mx = Math.max(1, ...per.map(p => p.n));
  $('per').innerHTML = per.map(p => `<div style="display:grid;grid-template-columns:200px 1fr 30px;gap:10px;align-items:center;margin:6px 0"><span>${esc(p.title)}</span><div class="bar" style="width:${p.n / mx * 100}%"></div><b>${p.n}</b></div>`).join('');
}
function reset() { $('f').reset(); $('rid').value = ''; $('ftitle').textContent = 'Register a student for a course'; $('save').textContent = 'Register'; $('cancel').hidden = true; }
$('f').onsubmit = e => {
  e.preventDefault();
  try {
    if ($('rid').value) { q('UPDATE registrations SET student_id=?, course_id=?, term=?, status=? WHERE reg_id=?', [$('sid').value, $('cid').value, $('term').value, $('status').value, +$('rid').value]); note('Registration updated.'); }
    else { q('INSERT INTO registrations (student_id, course_id, term, status) VALUES (?,?,?,?)', [$('sid').value, $('cid').value, $('term').value, $('status').value]); note('Student registered.'); }
    reset(); render();
  } catch (x) { note(String(x.message).includes('UNIQUE') ? 'This student is already registered for that course in this term.' : x.message, true); }
};
$('cancel').onclick = () => { reset(); note(''); };
$('q').oninput = render;
$('rows').onclick = e => {
  const d = e.target.dataset.d, ed = e.target.dataset.e;
  if (d && confirm('Delete registration #' + d + '?')) { q('DELETE FROM registrations WHERE reg_id=?', [+d]); note('Registration deleted.'); render(); }
  if (ed) { const r = q('SELECT * FROM registrations WHERE reg_id=?', [+ed])[0];
    $('rid').value = r.reg_id; $('sid').value = r.student_id; $('cid').value = r.course_id; $('term').value = r.term; $('status').value = r.status;
    $('ftitle').textContent = 'Edit registration #' + r.reg_id; $('save').textContent = 'Save changes'; $('cancel').hidden = false; scrollTo({top: 0, behavior: 'smooth'}); }
};
function renderPeople() {
  $('srows').innerHTML = q('SELECT * FROM students ORDER BY student_id').map(r => `<tr><td>${esc(r.student_id)}</td><td>${esc(r.full_name)}</td><td>${esc(r.email)}</td><td>${esc(r.department)}</td><td>${r.semester}</td><td><button class="sm del" data-ds="${esc(r.student_id)}">Delete</button></td></tr>`).join('');
  $('crows').innerHTML = q('SELECT * FROM courses ORDER BY course_id').map(r => `<tr><td>${esc(r.course_id)}</td><td>${esc(r.title)}</td><td>${r.credits}</td><td>${esc(r.instructor)}</td><td><button class="sm del" data-dc="${esc(r.course_id)}">Delete</button></td></tr>`).join('');
}
function refreshAll() { loadSelects(); render(); }
function dbError(x, what) {
  const m = String(x.message);
  alert(m.includes('FOREIGN KEY') ? 'Cannot delete: this ' + what + ' still has registrations. Delete those registrations first.'
      : m.includes('UNIQUE') ? 'This ' + what + ' already exists.' : 'Database error: ' + m);
}
$('sf').onsubmit = e => {
  e.preventDefault();
  try { q('INSERT INTO students VALUES (?,?,?,?,?)', [$('s_id').value.trim(), $('s_name').value.trim(), $('s_email').value.trim(), $('s_dept').value, +$('s_sem').value]);
    $('sf').reset(); refreshAll(); } catch (x) { dbError(x, 'student'); }
};
$('cf').onsubmit = e => {
  e.preventDefault();
  try { q('INSERT INTO courses VALUES (?,?,?,?)', [$('c_id').value.trim(), $('c_title').value.trim(), +$('c_cr').value, $('c_ins').value.trim()]);
    $('cf').reset(); refreshAll(); } catch (x) { dbError(x, 'course'); }
};
$('srows').onclick = e => { const id = e.target.dataset.ds;
  if (id && confirm('Delete student ' + id + '?')) { try { q('DELETE FROM students WHERE student_id=?', [id]); refreshAll(); } catch (x) { dbError(x, 'student'); } } };
$('crows').onclick = e => { const id = e.target.dataset.dc;
  if (id && confirm('Delete course ' + id + '?')) { try { q('DELETE FROM courses WHERE course_id=?', [id]); refreshAll(); } catch (x) { dbError(x, 'course'); } } };
initSqlJs({ locateFile: f => 'https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/' + f }).then(SQL => {
  db = new SQL.Database(); db.exec(SCHEMA); loadSelects(); render();
}).catch(() => note('Could not load the SQL engine. Check your internet connection.', true));
</script></body></html>
